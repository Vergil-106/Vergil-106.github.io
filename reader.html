
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading | BizzareWorldOfStories</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .reader {
            max-width: 850px;
            margin: 55px auto;
            padding: 25px 24px 80px;
        }

        .reader-back {
            color: #72bfff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 45px;
        }

        .reader-back:hover {
            color: #b9b8cd;
        }

        .reader-genre {
            color: #8b7cff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.8rem;
        }

        .reader h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin: 12px 0 8px;
        }

        .chapter-heading {
            color: #72bfff;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 1.8rem;
            margin: 35px 0;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(174, 165, 255, 0.2);
        }

        .chapter-content {
            color: #e0deef;
            font-family: "DM Sans", Arial, sans-serif;
            font-size: 1.08rem;
            line-height: 2.1;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            min-height: 180px;
        }

        .chapter-navigation {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 65px;
            padding-top: 25px;
            border-top: 1px solid rgba(174, 165, 255, 0.2);
        }

        .chapter-button {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid rgba(139, 124, 255, 0.5);
            border-radius: 30px;
            color: #f4f2ff;
            text-decoration: none;
            transition: background 0.2s;
        }

        .chapter-button:hover {
            background: rgba(98, 85, 217, 0.25);
        }

        .chapter-button.disabled {
            opacity: 0.35;
            pointer-events: none;
        }

        .page-message {
            text-align: center;
            padding: 100px 20px;
            color: #b9b8cd;
        }

        @media (max-width: 480px) {
            .chapter-navigation {
                flex-direction: column;
            }

            .chapter-button {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <main class="reader" id="reader-container">
        <p class="page-message">Preparing your reading experience...</p>
    </main>

    <script>
       async function loadChapter() {
    const container = document.getElementById("reader-container");
    const params = new URLSearchParams(window.location.search);

    const storyId = params.get("id");
    const requestedChapter = Number(params.get("chapter") || 0);

    if (!storyId) {
        container.textContent = "No story was selected.";
        return;
    }

    try {
        const response = await fetch("./stories.json");

        if (!response.ok) {
            throw new Error("Could not load stories.");
        }

        const stories = await response.json();
        const story = stories.find(item => item.id === storyId);

        if (!story) {
            container.textContent = "This story could not be found.";
            return;
        }

        const totalChapters =
            story.chapterCount || (story.chapters ? story.chapters.length : 0);

        if (totalChapters === 0) {
            container.textContent = "No chapters are available yet.";
            return;
        }

        const chapterIndex = Number.isInteger(requestedChapter)
            ? Math.max(0, Math.min(requestedChapter, totalChapters - 1))
            : 0;

        let chapter;

        if (story.folder) {
            const chapterResponse = await fetch(
                story.folder + "/chapter-" + (chapterIndex + 1) + ".txt"
            );

            if (!chapterResponse.ok) {
                throw new Error("Could not load chapter.");
            }

            const text = (await chapterResponse.text())
                .replace(/^\uFEFF/, "")
                .trim();
            const lines = text.split("\n");

            chapter = {
                title: lines[0].trim(),
                content: lines.slice(1).join("\n").trim()
            };
        } else {
            chapter = story.chapters[chapterIndex];
        }

        document.title = chapter.title + " | " + story.title;

        container.replaceChildren();

        const back = document.createElement("a");
        back.className = "reader-back";
        back.href = "story.html?id=" + encodeURIComponent(story.id);
        back.textContent = "← Back to Story Details";

        const genre = document.createElement("p");
        genre.className = "reader-genre";
        genre.textContent = story.genre || "Unclassified";

        const title = document.createElement("h1");
        title.textContent = story.title;

        const chapterTitle = document.createElement("h2");
        chapterTitle.className = "chapter-heading";
        chapterTitle.textContent = chapter.title;

        const content = document.createElement("div");
        content.className = "chapter-content";
        content.textContent = chapter.content || "This chapter is empty.";

        const navigation = document.createElement("nav");
        navigation.className = "chapter-navigation";

        const previous = document.createElement("a");
        previous.className = "chapter-button";
        previous.textContent = "← Previous Chapter";

        const next = document.createElement("a");
        next.className = "chapter-button";
        next.textContent = "Next Chapter →";

        const baseUrl =
            "reader.html?id=" + encodeURIComponent(story.id) + "&chapter=";

        if (chapterIndex > 0) {
            previous.href = baseUrl + (chapterIndex - 1);
        } else {
            previous.classList.add("disabled");
            previous.setAttribute("aria-disabled", "true");
        }

        if (chapterIndex < totalChapters - 1) {
            next.href = baseUrl + (chapterIndex + 1);
        } else {
            next.classList.add("disabled");
            next.setAttribute("aria-disabled", "true");
        }

        navigation.append(previous, next);

        container.append(
            back,
            genre,
            title,
            chapterTitle,
            content,
            navigation
        );

    } catch (error) {
        container.textContent =
            "The reader could not be opened. Please try again later.";
        console.error(error);
    }
}

loadChapter();
    </script>

</body>
</html>
